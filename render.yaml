services:
  - type: web
    name: signal-bot-acce
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EXECUTION_MODE
        value: PAPER
      - key: ENABLE_LIVE_TRADING
        value: "0"
      - key: ACCE_TRADE_BRAIN_ENABLED
        value: "1"
      - key: ACCE_LONG_ONLY
        value: "1"
      - key: ACCE_COLLATERAL_ASSET
        value: USDT
      - key: PM_SCALE_IN_ENABLED
        value: "0"
      - key: TELEGRAM_REPORT_STYLE
        value: HUMAN
      - key: TELEGRAM_FULL_HEARTBEAT
        value: "0"
      - key: TELEGRAM_DECISION_CHANGE_ONLY
        value: "1"
      - key: TELEGRAM_FORCE_HEARTBEAT_SECONDS
        value: "0"
      - key: SCAN_INTERVAL
        value: "300"
      - key: TELEGRAM_COMMAND_POLL_INTERVAL_SECONDS
        value: "5"
      - key: UNIFIED_SCAN_INTERVAL_SECONDS
        value: "120"
      - key: UNIFIED_LISTING_CANDIDATE_TTL_HOURS
        value: "72"
      - key: LONG_SETUP_ENGINE_ENABLED
        value: "1"
      - key: LONG_CONFLUENCE_MIN_SETUP
        value: "45"
      - key: LONG_CONFLUENCE_MIN_TRADE
        value: "68"
      - key: LONG_LATE_ENTRY_FILTER_ENABLED
        value: "1"
      - key: LONG_MEME_MIN_VOLUME_RATIO
        value: "1.8"
      # ATR-aware position management (sprint: PM v2)
      - key: ATR_ENABLED
        value: "1"
      - key: ATR_PERIOD
        value: "14"
      - key: STOP_ATR_MULTIPLIER
        value: "1.5"
      - key: STOP_ATR_CAP_MULTIPLIER
        value: "2.5"
      - key: TP_ADAPTIVE_ENABLED
        value: "1"
      # MEXC Cross Margin konservatif kaldirac tavanlari (live'da kullanilacak)
      - key: LEVERAGE_POLICY_EXCHANGE_MAX_LEV_CORE
        value: "5"
      - key: LEVERAGE_POLICY_EXCHANGE_MAX_LEV_HIGH_BETA
        value: "3"
      - key: LEVERAGE_POLICY_MIN_LIQ_TO_STOP
        value: "3.0"
      - key: LEVERAGE_POLICY_EXTRA_LIQ_BUFFER_PCT
        value: "0.01"

# Sprint 17 additional env:
# ACCE_MULTI_POSITION_ENABLED=1
# ACCE_ALLOW_SECOND_WITH_SAFE_STOP=1
# ACCE_MAX_ACTIVE_POSITIONS=4
# ACCE_MAX_OPEN_RISK_POSITIONS=2
