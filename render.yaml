services:
  - type: web
    name: signal-bot-v5-core
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    disk:
      name: signal-bot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # Core lifecycle
      - key: CORE_STATE_FILE
        value: /data/core_state.json
      - key: CORE_SEND_STARTUP_MESSAGE
        value: "1"
      - key: TELEGRAM_COMMAND_POLL_INTERVAL_SECONDS
        value: "5"

      # New CoinMarketCap coins through a contract-security screen (docs/NEW_COINS.md):
      # honeypot, owner powers, holder concentration, liquidity lock. Research only, no orders.
      # CMC_API_KEY: free Basic plan key from pro.coinmarketcap.com, set in the Render
      # dashboard (never in this file, logs or chat).
      - key: NEW_COINS_ENABLED
        value: "1"
      - key: NEW_COINS_SCAN_INTERVAL_SECONDS
        value: "1800"
      - key: NEW_COINS_WINDOW_HOURS
        value: "72"
      - key: NEW_COINS_LEDGER_FILE
        value: /data/new_coins_ledger.jsonl
      - key: CMC_API_KEY
        sync: false

      # Altcoin watch (docs/ALTCOIN_WATCH.md): weekly long-horizon fundamental screen of the 150
      # largest altcoins (supply, fees, hacks, contract powers, liquidity), pre-registered forward
      # record. Research only, no orders. COINGECKO_DEMO_API_KEY: free demo key from
      # coingecko.com/en/api, set in the Render dashboard (never in this file, logs or chat).
      - key: ALTCOIN_WATCH_ENABLED
        value: "1"
      - key: ALTCOIN_WATCH_REFRESH_SECONDS
        value: "604800"
      - key: ALTCOIN_WATCH_LEDGER_FILE
        value: /data/altcoin_watch_ledger.jsonl
      - key: COINGECKO_DEMO_API_KEY
        sync: false

      # Long tracking of the v3.2 report's coins (docs/POSITION_LONG.md §13–§14): the list lives in
      # research/register (the bot never selects); one decision a week after the Sunday close on MEXC
      # perpetual data (wick reference, leverage cap, funding, OI, weekly channel) and CoinGecko (regime).
      # Research only, no orders. The POSITION_* values are the user's risk budget, not system parameters.
      - key: LONG_WATCH_ENABLED
        value: "1"
      - key: LONG_WATCH_LEDGER_FILE
        value: /data/long_watch_ledger.jsonl
      - key: POSITION_MAINTENANCE_MARGIN
        value: "0.05"
      - key: POSITION_FUNDING_MAX
        value: "0.20"
      - key: POSITION_LOSS_BUDGET_ALTCOIN
        value: "0.01"
      - key: POSITION_LOSS_BUDGET_MEME
        value: "0.005"

      # D1 trend loop, shadow record (docs/TREND_LOOP_LIVE.md): daily 00:00 UTC
      # decisions on the majors, intraday acute stops, append-only ledger.
      # Alerts carry the RİSK_AZALTIR label (user decision 2026-10-02); no orders.
      - key: TREND_LOOP_ENABLED
        value: "1"
      - key: TREND_LOOP_ALERTS_ENABLED
        value: "1"
      - key: TREND_LOOP_LEDGER_FILE
        value: /data/trend_loop_ledger.jsonl
      - key: TREND_LOOP_STOP_INTERVAL_SECONDS
        value: "300"
