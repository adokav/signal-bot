services:
  - type: web
    name: signal-bot-acce
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EXECUTION_MODE
        value: PAPER
      - key: ENABLE_LIVE_TRADING
        value: "0"
      - key: ACCE_TRADE_BRAIN_ENABLED
        value: "1"
      - key: ACCE_LONG_ONLY
        value: "1"
      - key: ACCE_COLLATERAL_ASSET
        value: USDT
      - key: PM_SCALE_IN_ENABLED
        value: "0"
      - key: TELEGRAM_REPORT_STYLE
        value: HUMAN
      - key: TELEGRAM_FULL_HEARTBEAT
        value: "0"
      - key: TELEGRAM_DECISION_CHANGE_ONLY
        value: "1"
      - key: TELEGRAM_FORCE_HEARTBEAT_SECONDS
        value: "0"
      - key: SCAN_INTERVAL
        value: "300"
