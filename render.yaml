services:
  - type: web
    name: signal-bot-v5-core
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    disk:
      name: signal-bot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # Core lifecycle
      - key: CORE_STATE_FILE
        value: /data/core_state.json
      - key: CORE_SEND_STARTUP_MESSAGE
        value: "1"
      - key: TELEGRAM_COMMAND_POLL_INTERVAL_SECONDS
        value: "5"

      # Exactly two MEXC opportunity engines
      - key: UNIFIED_ENGINE_ENABLED
        value: "1"
      - key: UNIFIED_ENGINE_MODE
        value: SHADOW
      - key: UNIFIED_CEX_RADAR_ENABLED
        value: "1"
      - key: UNIFIED_LISTING_RADAR_ENABLED
        value: "1"
      - key: UNIFIED_SCAN_INTERVAL_SECONDS
        value: "120"

      # Liquid 100 — Long Top 3
      - key: UNIFIED_LIQUID_UNIVERSE_SIZE
        value: "100"
      - key: UNIFIED_LIQUID_ENRICHMENT_SIZE
        value: "100"
      - key: UNIFIED_LIQUID_FUNDAMENTAL_SIZE
        value: "100"
      - key: UNIFIED_LIQUID_LONG_TOP_N
        value: "3"
      - key: UNIFIED_LIQUID_MIN_QUOTE_VOLUME
        value: "1000000"
      - key: UNIFIED_LIQUID_MAX_24H_DRAWDOWN_PCT
        value: "-8"
      - key: UNIFIED_LIQUID_MAX_24H_GAIN_PCT
        value: "25"
      - key: UNIFIED_LIQUID_MAX_SPREAD_BPS
        value: "35"
      - key: UNIFIED_LIQUID_MIN_LONG_SCORE
        value: "64"
      - key: UNIFIED_LIQUID_REQUIRE_SUPPLY_DATA
        value: "true"

      # Point-in-time research archive. The bot still scans every 120 seconds,
      # while immutable ML/replay observations are sampled every 30 minutes.
      - key: LIQUID_OBSERVATION_ARCHIVE_ENABLED
        value: "true"
      - key: LIQUID_OBSERVATION_ARCHIVE_PATH
        value: /data/liquid100_observations.sqlite3
      - key: LIQUID_OBSERVATION_ARCHIVE_INTERVAL_SECONDS
        value: "1800"

      # Verified MEXC new listings
      - key: UNIFIED_LISTING_TOP_N
        value: "5"
      - key: UNIFIED_LISTING_MIN_SCORE
        value: "52"
      - key: UNIFIED_LISTING_MAX_CANDIDATES
        value: "20"
      - key: UNIFIED_LISTING_CANDIDATE_TTL_HOURS
        value: "72"
      - key: UNIFIED_LISTING_CONFIRMATION_SCANS
        value: "2"
      - key: UNIFIED_LISTING_MAX_DRAWDOWN_PCT
        value: "-8"
      - key: UNIFIED_LISTING_REQUIRE_OPEN_SPOT
        value: "true"
      - key: UNIFIED_LISTING_REQUIRE_SUPPLY_DATA
        value: "true"
      - key: UNIFIED_LISTING_SEEN_FILE
        value: /data/mexc_seen_symbols.json
      - key: UNIFIED_LISTING_CANDIDATE_FILE
        value: /data/mexc_listing_candidates.json

      # Internal enrichment only; no standalone Telegram menus
      - key: UNIFIED_FUNDAMENTAL_RADAR_ENABLED
        value: "true"
      - key: UNIFIED_FUNDAMENTAL_CACHE_TTL_SECONDS
        value: "1800"
      - key: UNIFIED_FUNDAMENTAL_MAX_ASSETS
        value: "100"
      - key: UNIFIED_SOCIAL_RADAR_ENABLED
        value: "true"
      - key: UNIFIED_SOCIAL_REDDIT_ENABLED
        value: "true"
      - key: UNIFIED_SOCIAL_GDELT_ENABLED
        value: "true"
      - key: UNIFIED_SOCIAL_CACHE_TTL_SECONDS
        value: "600"
      - key: UNIFIED_SOCIAL_MAX_ASSETS
        value: "6"
      - key: UNIFIED_SOCIAL_WINDOW_HOURS
        value: "6"
      - key: UNIFIED_SOCIAL_MIN_MENTIONS
        value: "4"
      - key: UNIFIED_SOCIAL_MIN_UNIQUE_AUTHORS
        value: "3"
      - key: UNIFIED_SOCIAL_MIN_PLATFORMS
        value: "1"
      - key: UNIFIED_SOCIAL_MIN_SENTIMENT
        value: "-10"
