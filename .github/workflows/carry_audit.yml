name: carry_audit

# Manual-trigger diagnostic: rebuilds the carry universe and lists the
# worst/best position-periods, perp/spot ratio breaks, per-year drivers
# and extreme funding prints, to explain STATIC_CARRY's -83% drawdown.
# Changes no verdict and no pre-registered code.
#
# How to run:
#   GitHub → Actions → carry_audit → Run workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements.txt
          -r requirements-dev.txt
          -r requirements-trading.txt
      - name: Build carry universe (data.binance.vision)
        run: |
          set -euo pipefail
          python -m trading.data.binance_carry_universe --out research/data/carry_universe --lookback-months 72 > /dev/null
      - name: Audit
        run: |
          set -euo pipefail
          python -m trading.backtest.carry_audit --data-dir research/data/carry_universe --out research/data/carry_audit.json
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carry-audit
          path: research/data/carry_audit.json
          retention-days: 30
