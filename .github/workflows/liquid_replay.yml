name: liquid_replay

# Manual-trigger research job: builds a survivorship-free Binance spot USDT
# universe (delisted pairs included), replays the live Liquid-100 long radar
# at every 15m close over 72 months and scores its picks against the rules
# pre-registered in docs/LIQUID_REPLAY_REPORT.md.
#
# No inputs on purpose: the protocol is fixed before any result. A
# different setting is a different trial and must be pre-registered first.
#
# Research only: no order authority, does not touch the production bot.
#
# How to run:
#   GitHub → Actions → liquid_replay → Run workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements.txt
          -r requirements-dev.txt
          -r requirements-trading.txt
      - name: Build survivorship-free universe (data.binance.vision)
        run: |
          set -euo pipefail
          python -m trading.data.binance_universe \
              --out research/data/liquid_universe \
              --lookback-months 72
          du -sh research/data/liquid_universe
      - name: Run Liquid-100 replay
        run: |
          set -euo pipefail
          echo "cpus: $(nproc)"; free -g
          python -m trading.backtest.liquid_replay \
              --data-dir research/data/liquid_universe \
              --out research/data/liquid_replay.json \
              --workers "$(nproc)" \
              --trial-registry research/trials/registry.jsonl \
              --record-trial
      - name: Emit run summary
        run: |
          set -euo pipefail
          {
            echo "## Likit-100 replay"
            echo ""
            echo '```json'
            python -c "
          import json, pathlib
          data = json.loads(pathlib.Path('research/data/liquid_replay.json').read_text())
          keys = ('n', 'unresolvable', 'mean_net_pct', 'mean_benchmark_pct', 'mean_excess_pct', 'excess_hit_rate',
                  'excess_ci_family', 'stressed_mean_net_pct', 'stressed_mean_excess_pct',
                  'first_half_excess_pct', 'second_half_excess_pct', 'verdict')
          summary = {
              'window': [data['start_time'], data['end_time']],
              'steps': {k: data[k] for k in ('symbols', 'steps', 'evaluated', 'skipped', 'mean_universe_size', 'rejected_rows')},
              'engine_fingerprint': data['engine_fingerprint'],
              'decision': {name: {k: g[k] for k in keys} for name, g in data['decision'].items()},
              'universe': {k: data['universe_manifest'].get(k) for k in ('candidates', 'downloaded', 'usdt_pairs')},
              'stopped_pairs': len(data['universe_manifest'].get('stopped_before_window_end') or []),
              'notes': data['notes'],
              'can_authorize_trade': data['can_authorize_trade'],
          }
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          "
            echo '```'
            echo ""
            echo "<details><summary>Strateji raporu (hipotez, kırılganlık, WHAT COULD BLOW UP THIS ACCOUNT?)</summary>"
            echo ""
            cat research/data/liquid_replay.md
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-replay
          path: |
            research/data/liquid_replay.json
            research/data/liquid_replay.md
            research/data/liquid_replay_observations.csv.gz
            research/data/liquid_universe/manifest.json
            research/trials/registry.jsonl
          retention-days: 30
