name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run retained test suite
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_core_bot.py \
            tests/test_liquid_long.py \
            tests/test_long_opportunity.py \
            tests/test_unified_engine.py \
            tests/test_unified_providers.py \
            tests/test_social_radar.py \
            tests/test_research_core.py \
            tests/test_listing_report_details.py \
            tests/test_new_listing_anti_trap.py \
            tests/test_liquid_observation_archive.py \
            tests/test_observation_archive_cadence.py > pytest-output.txt 2>&1
          rc=$?
          cat pytest-output.txt
          exit $rc
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
      - name: Compile active Python sources
        run: python -m compileall -q bot.py acce_unified tests/test_core_bot.py tests/test_long_opportunity.py tests/test_research_core.py tests/test_listing_report_details.py tests/test_new_listing_anti_trap.py tests/test_liquid_observation_archive.py tests/test_observation_archive_cadence.py
