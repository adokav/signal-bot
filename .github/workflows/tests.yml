name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run active core tests
        run: >-
          python -m pytest -q
          tests/test_core_bot.py
          tests/test_liquid_long.py
          tests/test_unified_engine.py
          tests/test_unified_providers.py
          tests/test_social_radar.py
      - name: Compile active Python sources
        run: python -m compileall -q bot.py acce_unified tests/test_core_bot.py
