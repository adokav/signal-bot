name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run retained test suite
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_core_bot.py \
            tests/test_liquid_long.py \
            tests/test_long_opportunity.py \
            tests/test_tactical_long.py \
            tests/test_tactical_long_data.py \
            tests/test_tactical_long_engine.py \
            tests/test_memecoin_radar_contracts.py \
            tests/test_unified_engine.py \
            tests/test_unified_providers.py \
            tests/test_social_radar.py \
            tests/test_research_core.py \
            tests/test_listing_report_details.py \
            tests/test_new_listing_anti_trap.py \
            tests/test_liquid_observation_archive.py \
            tests/test_observation_archive_cadence.py \
            tests/test_macro_data.py \
            tests/test_macro_treasury.py \
            tests/test_macro_factors.py \
            tests/test_macro_replay.py \
            tests/test_macro_runtime.py \
            tests/test_macro_validation.py \
            tests/test_macro_backfill.py \
            tests/test_macro_dataset.py \
            tests/test_macro_evidence.py \
            tests/test_macro_backfill_runtime.py > pytest-output.txt 2>&1
          rc=$?
          cat pytest-output.txt
          exit $rc
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
      - name: Compile active Python sources
        run: python -m compileall -q bot.py run_service.py acce_unified memecoin_radar macro_data.py macro_treasury.py macro_factors.py macro_replay.py macro_runtime.py macro_validation.py macro_backfill.py macro_dataset.py macro_evidence.py macro_backfill_runtime.py scripts/build_macro_history.py scripts/summarize_macro_evidence.py tests/test_core_bot.py tests/test_long_opportunity.py tests/test_tactical_long.py tests/test_tactical_long_data.py tests/test_tactical_long_engine.py tests/test_memecoin_radar_contracts.py tests/test_research_core.py tests/test_listing_report_details.py tests/test_new_listing_anti_trap.py tests/test_liquid_observation_archive.py tests/test_observation_archive_cadence.py tests/test_macro_data.py tests/test_macro_treasury.py tests/test_macro_factors.py tests/test_macro_replay.py tests/test_macro_runtime.py tests/test_macro_validation.py tests/test_macro_backfill.py tests/test_macro_dataset.py tests/test_macro_evidence.py tests/test_macro_backfill_runtime.py
