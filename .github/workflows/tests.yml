name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-trading.txt
      - name: Run retained test suite
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_core_bot.py \
            tests/test_cex.py \
            tests/test_altcoin_watch.py \
            tests/test_new_coins.py \
            tests/test_trend_loop.py \
            tests/test_binance_perp.py \
            tests/test_binance_vision.py \
            tests/test_binance_universe.py \
            tests/test_binance_carry_universe.py \
            tests/test_trading_cost_model.py \
            tests/test_tsmom.py \
            tests/test_walk_forward.py \
            tests/test_benchmark.py \
            tests/test_research_metrics.py \
            tests/test_research_calibration.py \
            tests/test_research_ev.py \
            tests/test_research_robustness.py \
            tests/test_research_decay_features.py \
            tests/test_research_report_promotion.py \
            tests/test_risk_gate.py \
            tests/test_carry_replay.py \
            tests/test_carry_audit.py \
            tests/test_listing_replay.py \
            tests/test_majors_signals.py \
            tests/test_trade_loop.py \
            tests/test_atlas.py \
            tests/test_breakout_cohort.py > pytest-output.txt 2>&1
          rc=$?
          cat pytest-output.txt
          exit $rc
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
      - name: Compile active Python sources
        run: python -m compileall -q bot.py acce_unified trading tests
