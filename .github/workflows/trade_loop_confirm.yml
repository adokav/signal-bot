name: trade_loop_confirm

# Manual-trigger research job: the ONE confirmation of the "exit when the trend
# breaks" loop (docs/TRADE_LOOP_STUDY.md) on the sealed window 2024-09 → 2026-08.
#
#   D1_20_10      enter on a daily close above the previous 20-day high close,
#                 exit on a close below the previous 10-day low close
#                 (3 ATR intraday disaster stop), majors universe.
#   D1_20_10_VOL  the same trades, slot x min(1, 50% / 30-day volatility).
#
# Both steps refuse to run unless the trial for the current code is in
# research/trials/registry.jsonl (pre-registered before any 2024-09+ trade-loop
# data was downloaded or seen). No inputs on purpose: a different setting is a
# different trial. Run it once; a second run is not a second confirmation.
#
# Research only: no order authority, does not touch the production bot.
#
# How to run:
#   GitHub → Actions → trade_loop_confirm → Run workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements.txt
          -r requirements-dev.txt
          -r requirements-trading.txt
      - name: Build the confirmation universe and funding (as of 2026-09-01)
        run: |
          set -euo pipefail
          python -m trading.backtest.trade_loop build-confirm --out research/data/tl_confirm_universe
          du -sh research/data/tl_confirm_universe
      - name: Confirm D1_20_10 and D1_20_10_VOL on 2024-09..2026-08
        run: |
          set -euo pipefail
          python -m trading.backtest.trade_loop confirm \
              --spot-dir research/data/tl_confirm_universe \
              --out research/data/trade_loop_confirm.json | tee research/data/trade_loop_confirm.txt
          {
            echo "## İşlem döngüsü doğrulaması (2024-09 → 2026-08)"
            echo '```'
            cat research/data/trade_loop_confirm.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-loop-confirm
          path: |
            research/data/trade_loop_confirm.json
            research/data/trade_loop_confirm.txt
            research/data/tl_confirm_universe/manifest.json
          retention-days: 30
