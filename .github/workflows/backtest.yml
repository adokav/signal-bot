name: backtest

# Manual-trigger workflow that downloads Binance USDⓈ-M perpetual data
# for the configured symbol, runs the walk-forward TSMOM backtest, and
# uploads the resulting JSON report + parquet snapshots as build artifacts.
#
# This is a research job. It does not authorize any order, does not touch
# the production bot.py service, and produces read-only artifacts.
#
# How to run:
#   GitHub → Actions → backtest → Run workflow → pick a symbol
#
# The artifact is retained for 30 days on the workflow run page.

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Binance USDⓈ-M perpetual symbol (e.g. BTCUSDT)"
        required: true
        default: BTCUSDT
        type: choice
        options:
          - BTCUSDT
          - ETHUSDT
          - SOLUSDT
      folds:
        description: "Number of walk-forward folds"
        required: false
        default: "4"
        type: string
      embargo_days:
        description: "Embargo days between train and test slabs"
        required: false
        default: "3"
        type: string
      horizon_hours:
        description: "Max hours per trade for exit simulation (must be >= the 168h time-stop)"
        required: false
        default: "168"
        type: string
      perturb:
        description: "Run parameter perturbation (spec §15; needed for promotion checklist)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements.txt
          -r requirements-dev.txt
          -r requirements-trading.txt
      - name: Download Binance perpetual data (via data.binance.vision)
        # The live fapi.binance.com endpoint returns HTTP 451 for GitHub
        # Actions runners (Azure US IP ranges are geo-blocked). The
        # data.binance.vision CDN carries the same historical klines +
        # funding as monthly zip dumps and has no geographic ACL, so it
        # stays reachable from CI.
        run: |
          set -euo pipefail
          python -m trading.data.binance_vision "${{ github.event.inputs.symbol }}" \
              --out research/data/binance_perp
      - name: Run walk-forward backtest
        run: |
          set -euo pipefail
          python -m trading.backtest.walk_forward "${{ github.event.inputs.symbol }}" \
              --data-dir research/data/binance_perp \
              --out "research/data/backtest_${{ github.event.inputs.symbol }}.json" \
              --folds "${{ github.event.inputs.folds }}" \
              --embargo-days "${{ github.event.inputs.embargo_days }}" \
              --horizon-hours "${{ github.event.inputs.horizon_hours }}" \
              --trial-registry research/trials/registry.jsonl \
              --record-trial \
              ${{ github.event.inputs.perturb == 'true' && '--perturb' || '' }}
      - name: Emit run summary
        run: |
          set -euo pipefail
          symbol="${{ github.event.inputs.symbol }}"
          json="research/data/backtest_${symbol}.json"
          {
            echo "## Backtest — ${symbol}"
            echo ""
            echo '```json'
            python -c "
          import json, pathlib
          data = json.loads(pathlib.Path('$json').read_text())
          perf = data.get('performance') or {}
          bench = data.get('benchmark') or {}
          dsr = data.get('deflated_sharpe') or {}
          stab = data.get('parameter_stability') or {}
          promo = data.get('promotion') or {}
          summary = {
              'trades': data.get('trades'),
              'horizon_hours': data.get('horizon_hours'),
              'strategy': {k: perf.get(k) for k in (
                  'expectancy_pct', 'profit_factor', 'sharpe_annualized', 'sortino_annualized',
                  'max_drawdown_pct', 'calmar_ratio', 'win_rate', 'payoff_ratio',
                  'max_consecutive_losses', 'tail_loss_p5_pct', 'sample_quality')},
              'benchmark': {'sharpe': bench.get('sharpe_annualized'), 'max_dd_pct': bench.get('max_drawdown_pct')},
              'cost_stress': (data.get('cost_stress') or {}).get('verdict'),
              'entry_delay': data.get('entry_delay_verdict'),
              'bootstrap_expectancy_ci': data.get('bootstrap_expectancy_ci'),
              'deflated_sharpe': {'probability': dsr.get('deflated_sharpe_probability'), 'n_trials': dsr.get('n_trials')},
              'parameter_stability': stab.get('verdict'),
              'promotion_stage': promo.get('stage'),
              'exit_reasons': (data.get('aggregate') or {}).get('exit_reason_breakdown'),
          }
          print(json.dumps(summary, indent=2))
          "
            echo '```'
            echo ""
            echo "<details><summary>Strateji raporu (hipotez, kırılganlık, WHAT COULD BLOW UP THIS ACCOUNT?)</summary>"
            echo ""
            cat "research/data/backtest_${symbol}.md"
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.event.inputs.symbol }}
          path: |
            research/data/backtest_*.json
            research/data/backtest_*.md
            research/trials/registry.jsonl
            research/data/binance_perp/*.parquet
          retention-days: 30
