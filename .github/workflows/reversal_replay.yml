name: reversal_replay

# Manual-trigger research job: builds the survivorship-free Binance spot
# universe for the untouched 2017-09 → 2020-09 holdout (nothing published
# after 2020-09-30 is read) and runs the pre-registered short-term reversal
# test (docs/REVERSAL_REPLAY_REPORT.md). No inputs: the protocol is fixed.
#
# Research only: no order authority, does not touch the production bot.
#
# How to run:
#   GitHub → Actions → reversal_replay → Run workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements.txt
          -r requirements-dev.txt
          -r requirements-trading.txt
      - name: Build the 2017-2020 holdout universe (data.binance.vision)
        run: |
          set -euo pipefail
          python -m trading.backtest.reversal_replay build --out research/data/reversal_universe
          du -sh research/data/reversal_universe
      - name: Run reversal replay
        run: |
          set -euo pipefail
          python -m trading.backtest.reversal_replay run \
              --data-dir research/data/reversal_universe \
              --out research/data/reversal_replay.json \
              --trial-registry research/trials/registry.jsonl \
              --record-trial
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reversal-replay
          path: |
            research/data/reversal_replay.json
            research/data/reversal_replay.md
            research/data/reversal_universe/manifest.json
            research/trials/registry.jsonl
          retention-days: 30
